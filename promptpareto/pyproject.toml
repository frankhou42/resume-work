[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "promptpareto"
version = "0.1.0"
description = "Turn prompt engineering into a measured optimization problem: multi-provider eval + Pareto optimization over accuracy, cost, and latency."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Frank Hou", email = "frankhou@utexas.edu" }]
keywords = ["llm", "evaluation", "prompt-optimization", "pareto", "openai", "anthropic", "ollama"]
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
    "numpy>=1.26",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.40"]
ollama = ["ollama>=0.3"]
all = ["promptpareto[openai,anthropic,ollama]"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
promptpareto = "promptpareto.cli:main"

[project.urls]
Homepage = "https://github.com/frankhou42/promptpareto"

[tool.hatch.build.targets.wheel]
packages = ["src/promptpareto"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--cov=promptpareto --cov-report=term-missing"
